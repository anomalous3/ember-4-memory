[project]
name = "ember4"
version = "4.0.0-dev"
description = "Persistent memory for Claude Code and Codex — graph-aware retrieval with Nomic embeddings, BM25, and engagement-driven importance signal"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",            # FastMCP API; mcp 2.x renamed it to MCPServer
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "sqlite-vec~=0.1.6",
    "numpy>=1.24.0",
    "scipy>=1.11.0",            # sparse matrix ops in recall_v4 (PPR)
    "aiosqlite>=0.20.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
fuzzy = ["thefuzz>=0.22.0"]    # Fuzzy string matching for archive_grep
# scikit-learn and networkx were experimented with during the v4 build
# but only scipy.sparse ended up in the live recall path. They aren't
# required to run ember-4; install them ad-hoc if you want to extend the
# graph diffusion code.

[tool.hatch.build.targets.wheel]
packages = ["ember4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
